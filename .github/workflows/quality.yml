name: OmniRep Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install contract dependencies
        run: npm install
      - name: Install frontend dependencies
        run: npm --prefix frontend install
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: JavaScript syntax
        run: |
          node --check hardhat.config.js
          node --check scripts/deploy.js
          node --check scripts/deploy-base.js
          node --check test/OmniRep.js

      - name: Python compile
        run: python -m py_compile backend/*.py

      - name: Static project validation
        run: python scripts/validate.py

      - name: Frontend build
        run: npm --prefix frontend run build

      - name: Contract tests
        run: npm run contracts:test
